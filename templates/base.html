<!DOCTYPE html>
<html>
<head><title>{% block title %}CampusConnect{% endblock %}</title></head>
<body>
<nav>
{% if user.is_authenticated %}
    Hi, {{ user.username }}!
<form method="post" action="{ % url 'logout' %}">
    {% csrf_token %}
<button type="submit">Log out</button>
</form>
{% else %}
<a href="{% url 'login' %}">Log in</a>
<a href="{% url 'signup' %}">Sign up</a>
{% endif %}
</nav>
 
<main>{% block content %}{% endblock %}</main>
<footer>
    {% block footer %}CampusConnect &copy; 2026{% endblock %}
</footer>
</body>
</html>
