{% extends "base.html" %}
{% block title %}CampusConnect - Log In{% endblock %}
{% block content %}
<h2>Log in to your account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p> No Account? <a href="{% url 'signup' %}">Sign up here</a></p>
{% endblock %}
